<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication_form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">ϟ</div>
      <h1 id="login-title">Login</h1>
      <p class="subtitle">Enter your details to log in.</p>

      <form action="#" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email"                                                                           
                 autocomplete="email" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a class="small-link" href="#forgot password">Forgot password?</a>
          </div>
          <input type="password" id="password" name="password"
                 placeholder="Enter your password" autocomplete="current-password"
                 minlength="8" required>
        </div>

        <button class="primary-button" type="submit">Log In</button>
      </form>

      <div class="separator"><span>OR</span></div>

      <div class="social-buttons">
        <button class="social-button" type="button" aria-label="Continue with Google">
          <span class="google-mark" aria-hidden="true">G</span>
          Continue with Google
        </button>
        <button class="social-button" type="button" aria-label="Continue with Apple">
          <span class="apple-mark" aria-hidden="true">🍎</span>
          Continue with Apple
        </button>
      </div>

      <p class="switch-page">Don't have an account yet? <a href="signup.html">Sign up</a></p>
    </section>
  </main>
</body>
</html>

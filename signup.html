<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication_form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="auth-card signup-card" aria-labelledby="signup-title">
      <div class="brand-mark" aria-hidden="true">ϟ</div>
      <h1 id="signup-title">Create an account</h1>
      <p class="subtitle">Fill in your details to get started.</p>

      <form action="#" method="post">
        <div class="form-group">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" name="full_name" placeholder="Enter your full name"
                 autocomplete="name" minlength="2" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email"
                 autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="number" id="phone" name="phone" placeholder=" +250 7XX XXX XXX"
                 autocomplete="number"  required>
        </div>

       
<div class="form-group">
    <label for="password">Password</label>

    <div class="password-box">
        <input type="password" id="password"
               placeholder="Create a password"
               minlength="8" required>

        <span class="eye-icon">👁️</span>
    </div>
</div>


        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm_password"
                 placeholder="Enter your password again" autocomplete="new-password"
                 minlength="8" required>
        </div>

        <label class="terms">
          <input type="checkbox" name="terms" required>
          <span>I agree to the <a href="#terms">Terms and Conditions</a>.</span>
        </label>

        <button class="primary-button" type="submit">Create Account</button>
      </form>

      <p class="switch-page">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
